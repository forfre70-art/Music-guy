name: Music Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Показать все файлы
        run: |
          echo "=== КОРЕНЬ РЕПОЗИТОРИЯ ==="
          ls -la
          echo "=== ПОИСК package.json ==="
          find . -name "package.json" -type f
          echo "=== ПОИСК index.js ==="
          find . -name "index.js" -type f
